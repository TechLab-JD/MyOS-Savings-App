<div class="app-window" id="SavingsApp">
  <div class="app-header"><span class="app-title">🎯 Savings Goal</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="sv">
      <div class="sv-set"><label>Goal name <input id="sv-name" placeholder="New laptop"></label><label>Target $ <input id="sv-target" type="number" min="1" value="1000"></label></div>
      <div id="sv-bar" class="sv-bar"><div id="sv-fill" class="sv-fill"></div><span id="sv-pct"></span></div>
      <div id="sv-stat" class="sv-stat"></div>
      <div class="sv-add"><input id="sv-amt" type="number" placeholder="Add amount"><button id="sv-go">Add</button></div>
      <div id="sv-log" class="sv-log"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
